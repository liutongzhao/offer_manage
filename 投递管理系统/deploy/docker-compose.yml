# 秋招投递管理系统 —— 服务器部署编排
# 用法（在 deploy/ 目录下）：
#   docker compose --env-file backend.env up -d      # 首次启动 / 日常启动
#   docker compose logs -f backend                   # 看后端日志
#   docker compose build backend web && docker compose up -d   # 更新代码后重建
# 端口规划：80=网页（Nginx+密码）  9000=MinIO 预签名直连  其余端口一律不对公网开放

services:
  minio:
    image: minio/minio:latest
    container_name: offer-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./minio-data:/data
    ports:
      - "9000:9000"        # S3 API：预签名 URL 浏览器直连，必须开放
      - "127.0.0.1:9001:9001"  # 管理台：只绑本机，管理时 SSH 隧道访问
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    container_name: offer-backend
    env_file: backend.env
    volumes:
      - ./app-data:/app/data    # SQLite 数据库持久化
    depends_on:
      - minio
    expose:
      - "5112"             # 只在 compose 内网，不映射公网
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    container_name: offer-web
    ports:
      - "80:80"
    volumes:
      - ./htpasswd:/etc/nginx/.htpasswd:ro   # 访问密码，首次部署前生成
    depends_on:
      - backend
    restart: unless-stopped
