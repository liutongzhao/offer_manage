# 秋招投递管理系统 —— Nginx 站点配置
# 全站 basic auth（htpasswd 由部署时生成，compose 挂载到 /etc/nginx/.htpasswd）
server {
    listen 80;
    server_name _;

    # 访问密码（首次部署按指南生成；想先裸奔测试可临时注释这两行）
    auth_basic "秋招投递管理系统";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # 附件上传（简历 PDF / JD 截图等）
    client_max_body_size 50m;

    # 后端 API：反代到 compose 内网的 backend 容器
    location /api/ {
        proxy_pass http://backend:5112;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # 前端静态文件（Vue SPA：路由回退到 index.html）
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location /assets/ {
        root /usr/share/nginx/html;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
